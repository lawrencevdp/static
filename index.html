<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#11131b">
    <title>Calculator</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <main class="calculator" aria-label="Calculator">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">÷</span>
          <span>CALCULATOR</span>
        </div>
        <span class="status"><span class="status-dot"></span> READY</span>
      </header>

      <section class="display" aria-live="polite">
        <div id="expression" class="expression" aria-label="Expression">0</div>
        <div id="result" class="result" aria-label="Result">0</div>
      </section>

      <section class="keypad" aria-label="Calculator keys">
        <button class="key utility" data-action="clear">AC</button>
        <button class="key utility" data-action="backspace" aria-label="Delete last character">⌫</button>
        <button class="key utility" data-value="%">%</button>
        <button class="key operator" data-value="/">÷</button>

        <button class="key" data-value="7">7</button>
        <button class="key" data-value="8">8</button>
        <button class="key" data-value="9">9</button>
        <button class="key operator" data-value="*">×</button>

        <button class="key" data-value="4">4</button>
        <button class="key" data-value="5">5</button>
        <button class="key" data-value="6">6</button>
        <button class="key operator" data-value="-">−</button>

        <button class="key" data-value="1">1</button>
        <button class="key" data-value="2">2</button>
        <button class="key" data-value="3">3</button>
        <button class="key operator" data-value="+">+</button>

        <button class="key utility" data-action="sign">+/−</button>
        <button class="key" data-value="0">0</button>
        <button class="key" data-value=".">.</button>
        <button class="key equals" data-action="equals">=</button>
      </section>
      <footer>Built for clear thinking.</footer>
    </main>
  </body>
</html>
